general {
    lock_cmd = 'exec hyprlock "$@"'
    before_sleep_cmd = 'exec hyprlock "$@"'
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600
    on-timeout = 'exec hyprlock "$@"'
}
